# 引擎自动同步：从官方 deepseek-ai/deepseek-harness 构建 dsh-runtime zip 并发布到本仓库。
#
# 注意：desktop 构建工具在本仓库（dsh-desktop），官方仓库只作为代码源
# （通过 DSH_DESKTOP_REPO_ROOT 指定给 prepare-runtime）。官方仓库本身没有
# desktop/ 目录，所以不能用 working-directory: harness/desktop。
#
# 每 6 小时自动 + 手动触发。产物：dsh-engine-v<版本> Release 的
# dsh-runtime-v<版本>.zip + .sha256；桌面版“检查引擎更新…”从中下载（~2 分钟）。

name: engine-sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (desktop build tooling)
        uses: actions/checkout@v4

      - name: Checkout official harness (source)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install and build harness (lib + web)
        working-directory: harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build dsh runtime zip
        shell: pwsh
        env:
          DSH_DESKTOP_REPO_ROOT: ${{ github.workspace }}/harness
        run: |
          npm ci
          npm run prepare:runtime
          npm run build:runtime-zip

      - name: Read engine version
        id: ver
        shell: pwsh
        run: |
          $m = Get-Content .runtime/dsh-deploy/node_modules/@deepseek-ai/dsh/package.json | ConvertFrom-Json
          "version=$($m.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish engine zip to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $zip = "release/dsh-runtime-v$v.zip"
          $sha = "release/dsh-runtime-v$v.zip.sha256"
          $tag = "dsh-engine-v$v"
          gh release view $tag --json name *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip $sha --title "dsh engine v$v" --notes "自动同步官方 deepseek-ai/deepseek-harness@$v" --latest=false
          } else {
            gh release upload $tag $zip $sha --clobber
          }
