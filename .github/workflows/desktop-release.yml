# 壳发布：打 dsh-desktop-v* 标签（或手动触发）时，从官方 harness 构建完整
# 安装包并发布到本仓库 Releases（electron-builder --publish always）。
# 同时把配套引擎 zip（dsh-runtime-vX.zip + .sha256）一并上传到同一 Release，
# 方便用户回退到“与壳最适配”的引擎版本。
#
# 注意：desktop 构建工具在本仓库，官方仓库只作为代码源
# （DSH_DESKTOP_REPO_ROOT 指向 harness）；官方仓库没有 desktop/ 目录。

name: desktop-release

on:
  push:
    tags:
      - 'dsh-desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (desktop build tooling)
        uses: actions/checkout@v4

      - name: Checkout official harness (source)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install and build harness (lib + web)
        working-directory: harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install desktop dependencies
        # 必须先装桌面端依赖（tsc / electron-builder 等），否则 npm run 直接失败。
        # postinstall 会从 npmmirror 下载 electron 二进制（npm ci 自带）。
        run: npm ci

      - name: Build and publish desktop installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_DESKTOP_REPO_ROOT: ${{ github.workspace }}/harness
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          # 安装包内置引擎 = 线上最新 dsh-engine-v*（engine-sync 已发布的引擎 zip），
          # 保证"壳每次构建后内置引擎与线上引擎同步"：用户装完壳即用最新引擎，
          # 无需再手动检查引擎更新。线上暂无引擎 release 时回退本地源码构建。
          $synced = $false
          try {
            $rels = gh release list --repo $env:GITHUB_REPOSITORY --limit 50 --json tagName,assets 2>$null | ConvertFrom-Json
            $rel = $rels | Where-Object { $_.tagName -like 'dsh-engine-v*' } | Select-Object -First 1
            $zip = $null
            if ($rel) { $zip = $rel.assets | Where-Object { $_.name -like 'dsh-runtime-v*.zip' } | Select-Object -First 1 }
            if ($zip) {
              Write-Output "bundling engine from $($rel.tagName) ($($zip.name))"
              gh release download $rel.tagName --repo $env:GITHUB_REPOSITORY --pattern $zip.name --dir .runtime-download --clobber
              New-Item -ItemType Directory -Force -Path .runtime | Out-Null
              Expand-Archive -Path ".runtime-download/$($zip.name)" -DestinationPath .runtime -Force
              $dshManifest = ".runtime/dsh-deploy/node_modules/@deepseek-ai/dsh/package.json"
              if (Test-Path ".runtime/node/node.exe" -and (Test-Path $dshManifest)) {
                $synced = $true
                Write-Output "runtime synced: v$((Get-Content $dshManifest | ConvertFrom-Json).version)"
              }
            }
          } catch {
            Write-Output "engine zip sync failed: $($_.Exception.Message); falling back to local build"
          }
          if (-not $synced) {
            npm run prepare:runtime
          }
          # 壳版本始终与内置引擎版本一致（不做自增）
          npm run sync:version
          npm run build:runtime-zip
          # 只打包、不发布：发布统一走下面的 gh release 步骤，确保主安装包
          # exe 一定被上传（electron-builder --publish 在 release 已存在时会
          # 跳过已存在资产，导致 exe 缺失而 blockmap 却传上去了）。
          npx electron-builder --win nsis --publish never

      - name: Upload installer + engine to GitHub release
        # 用 gh release 统一创建 release 并上传全部资产，保证 exe 一定在。
        # release 标签取 package.json 版本（v<version>），与触发 tag（dsh-desktop-v*）无关。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$v"
          # 主安装包 + blockmap + 更新清单（electron-builder 产物）
          # 注意：[regex]::Escape 会把结尾的 $ 也转义成 \$，所以用 Escape(前缀)+'$'
          # 拼出"以该串结尾"的锚点，否则匹配的是字面 $ 符号、永远不命中。
          $exe = Get-ChildItem release/DeepSeek-Harness-Setup-*.exe | Where-Object { $_.Name -match ([regex]::Escape("-$v.exe") + '$') } | Select-Object -First 1
          $blockmap = Get-ChildItem release/DeepSeek-Harness-Setup-*.exe.blockmap | Where-Object { $_.Name -match ([regex]::Escape("-$v.exe.blockmap") + '$') } | Select-Object -First 1
          $yml = Get-ChildItem release/latest.yml | Select-Object -First 1
          # 配套引擎 zip + sha256
          $zip = Get-ChildItem release/dsh-runtime-v*.zip | Where-Object { $_.Name -match ([regex]::Escape("-v$v.zip") + '$') } | Select-Object -First 1
          $sha = Get-ChildItem release/dsh-runtime-v*.zip.sha256 | Where-Object { $_.Name -match ([regex]::Escape("-v$v.zip.sha256") + '$') } | Select-Object -First 1

          if (-not $exe) { throw "主安装包未找到: release/DeepSeek-Harness-Setup-$v.exe" }

          # 收集要上传的文件
          $files = @($exe.FullName)
          if ($blockmap) { $files += $blockmap.FullName }
          if ($yml) { $files += $yml.FullName }
          if ($zip) { $files += $zip.FullName }
          if ($sha) { $files += $sha.FullName }

          # release 已存在则复用（可能来自上次的残缺 draft），否则创建
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "DeepSeek Harness v$v" --notes "DeepSeek Harness desktop v$v" `
              --draft $files
          } else {
            # 已存在：先清掉同名旧资产再上传（避免 exe 缺失的残缺状态残留）
            $assetNames = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' 2>$null
            foreach ($asset in $assetNames) {
              if ($asset -and $asset.Trim() -ne '') {
                gh release delete-asset $tag $asset --repo $env:GITHUB_REPOSITORY --yes *> $null
              }
            }
            gh release upload $tag $files --repo $env:GITHUB_REPOSITORY --clobber
          }

      - name: Publish release (draft -> public)
        # 转成正式 release 才能成为 latest，用户端 electron-updater 才能查到。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit "v$v" --draft=false
