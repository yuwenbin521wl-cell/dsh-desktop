# 壳发布：打 dsh-desktop-v* 标签（或手动触发）时，从官方 harness 构建完整
# 安装包并发布到本仓库 Releases（electron-builder --publish always）。
# 同时把配套引擎 zip（dsh-runtime-vX.zip + .sha256）一并上传到同一 Release，
# 方便用户回退到“与壳最适配”的引擎版本。
#
# 注意：desktop 构建工具在本仓库，官方仓库只作为代码源
# （DSH_DESKTOP_REPO_ROOT 指向 harness）；官方仓库没有 desktop/ 目录。

name: desktop-release

on:
  push:
    tags:
      - 'dsh-desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (desktop build tooling)
        uses: actions/checkout@v4

      - name: Checkout official harness (source)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install and build harness (lib + web)
        working-directory: harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install desktop dependencies
        # 必须先装桌面端依赖（tsc / electron-builder 等），否则 npm run 直接失败。
        # postinstall 会从 npmmirror 下载 electron 二进制（npm ci 自带）。
        run: npm ci

      - name: Build and publish desktop installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_DESKTOP_REPO_ROOT: ${{ github.workspace }}/harness
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          # 安装包内置引擎 = 线上最新 dsh-engine-v*（engine-sync 已发布的引擎 zip），
          # 保证"壳每次构建后内置引擎与线上引擎同步"：用户装完壳即用最新引擎，
          # 无需再手动检查引擎更新。线上暂无引擎 release 时回退本地源码构建。
          $synced = $false
          try {
            $rels = gh release list --repo $env:GITHUB_REPOSITORY --limit 50 --json tagName,assets 2>$null | ConvertFrom-Json
            $rel = $rels | Where-Object { $_.tagName -like 'dsh-engine-v*' } | Select-Object -First 1
            $zip = $null
            if ($rel) { $zip = $rel.assets | Where-Object { $_.name -like 'dsh-runtime-v*.zip' } | Select-Object -First 1 }
            if ($zip) {
              Write-Output "bundling engine from $($rel.tagName) ($($zip.name))"
              gh release download $rel.tagName --repo $env:GITHUB_REPOSITORY --pattern $zip.name --dir .runtime-download --clobber
              New-Item -ItemType Directory -Force -Path .runtime | Out-Null
              Expand-Archive -Path ".runtime-download/$($zip.name)" -DestinationPath .runtime -Force
              $dshManifest = ".runtime/dsh-deploy/node_modules/@deepseek-ai/dsh/package.json"
              if (Test-Path ".runtime/node/node.exe" -and (Test-Path $dshManifest)) {
                $synced = $true
                Write-Output "runtime synced: v$((Get-Content $dshManifest | ConvertFrom-Json).version)"
              }
            }
          } catch {
            Write-Output "engine zip sync failed: $($_.Exception.Message); falling back to local build"
          }
          if (-not $synced) {
            npm run prepare:runtime
          }
          # 壳版本始终与内置引擎版本一致（不做自增）
          npm run sync:version
          npm run build:runtime-zip
          npx electron-builder --win nsis --publish always

      - name: Upload companion engine zip to the same release
        # electron-builder 创建的 release 标签是 v<version>（如 v0.1.0-rc.5），
        # 不是触发事件的 tag（dsh-desktop-v*），所以从 package.json 读版本号定位。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$v"
          $zip = Get-ChildItem release/dsh-runtime-v*.zip | Select-Object -First 1
          if ($zip) {
            $sha = "$($zip.FullName).sha256"
            gh release view $tag *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --title "DeepSeek Harness v$v" --notes "DeepSeek Harness desktop v$v" --draft
            }
            gh release upload $tag $zip.FullName $sha --clobber
          }

      - name: Publish release (draft -> public)
        # electron-builder --publish 默认创建 draft release；draft 不算 latest，
        # 用户端 electron-updater 查不到，必须转成正式 release。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit "v$v" --draft=false
