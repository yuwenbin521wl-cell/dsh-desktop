# 壳发布：打 dsh-desktop-v* 标签（或手动触发）时，从官方 harness 构建完整
# 安装包并发布到本仓库 Releases（electron-builder --publish always）。
# 同时把配套引擎 zip（dsh-runtime-vX.zip + .sha256）一并上传到同一 Release，
# 方便用户回退到“与壳最适配”的引擎版本。

name: desktop-release

on:
  push:
    tags:
      - 'dsh-desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout official harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install and build harness (lib + web)
        working-directory: harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build desktop installer + runtime zip
        working-directory: harness/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # dist:publish = build + prepare:runtime + build:runtime-zip + electron-builder --publish always
        run: npm run dist:publish

      - name: Upload companion engine zip to the same release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem harness/desktop/release/dsh-runtime-v*.zip | Select-Object -First 1
          if ($zip) {
            $sha = "$($zip.FullName).sha256"
            gh release upload "${{ github.ref_name }}" $zip.FullName $sha --clobber
          }
